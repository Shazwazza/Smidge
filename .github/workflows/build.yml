name: Smidge Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - 'release/*'
    tags:
      - 'v*'

  pull_request:
    branches:
      - master
      - develop
      - 'release/*'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      Solution_File: Smidge.slnx
      Test_Proj: test/Smidge.Tests/Smidge.Tests.csproj
      Configuration: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create copyright value
      run: |
        $Copyright = "Copyright " + [char]0x00A9 + " Shannon Deminick " + (Get-Date).year
        echo ("Copyright=" + $Copyright) >> $Env:GITHUB_ENV
      shell: pwsh

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          10.0.x

    - name: Install dependencies
      run: dotnet restore ${{ env.Solution_File }}

    - name: Build
      run: dotnet build ${{ env.Solution_File }} --configuration ${{ env.Configuration }} --no-restore

    - name: Test
      run: dotnet test "${{ env.Test_Proj }}" --no-build --verbosity normal --results-directory ${{ github.workspace }}/_TestResults  --logger "trx;logfilename=tests.trx"

    - uses: actions/upload-artifact@v4  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: smidge-test-results
        path:  ${{ github.workspace }}/_TestResults/tests.trx

    - name: Determine package version
      run: |
        $PackageVersionOutputFile = Join-Path $Env:GITHUB_WORKSPACE "_PackageVersion.env"
        dotnet msbuild src/Smidge/Smidge.csproj `
          -target:WritePackageVersion `
          -property:Configuration=${{ env.Configuration }} `
          -property:ContinuousIntegrationBuild=true `
          -property:PackageVersionOutputFile="$PackageVersionOutputFile"
        $PackageVersion = (Get-Content $PackageVersionOutputFile).Substring("PackageVersion=".Length)
        Write-Host "Using package version: $PackageVersion"
        Get-Content $PackageVersionOutputFile >> $Env:GITHUB_ENV
      shell: pwsh

    - name: Export version
      id: version
      run: echo "version=${{ env.PackageVersion }}" >> "$GITHUB_OUTPUT"

    # This will do a rebuild
    - name: Pack
      if: success()
      run: |
        dotnet pack ${{ env.Solution_File }} \
          --configuration ${{ env.Configuration }} \
          --no-restore \
          -p:ContinuousIntegrationBuild=true \
          -p:Copyright="${{ env.Copyright }}" \
          --output=${{ github.workspace }}/_NugetOutput

    - uses: actions/upload-artifact@v4  # upload nuget
      if: ${{ success() }}
      with:
        name: smidge-nuget-${{ env.PackageVersion }}
        path:  ${{ github.workspace }}/_NugetOutput/*.*

  # Opt-in publish: only runs for v* tags and pauses for approval via the protected 'nuget' environment.
  # See .github/RELEASING.md for the one-time setup.
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    environment:
      name: nuget
      url: https://www.nuget.org/packages/Smidge/${{ needs.build.outputs.version }}

    permissions:
      contents: write  # create the GitHub release
      id-token: write  # NuGet trusted publishing (OIDC)

    env:
      PackageVersion: ${{ needs.build.outputs.version }}

    steps:
    - name: Download packages
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: smidge-nuget-${{ env.PackageVersion }}
        path: ${{ github.workspace }}/_NugetOutput

    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x

    - name: NuGet login (trusted publishing)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet
      # Symbol packages (.snupkg) next to each .nupkg are pushed automatically
      run: |
        dotnet nuget push "${{ github.workspace }}/_NugetOutput/*.nupkg" \
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        prerelease=""
        if [[ "$PackageVersion" == *-* ]]; then prerelease="--prerelease"; fi
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$TAG" _NugetOutput/*.nupkg _NugetOutput/*.snupkg --clobber --repo "$GITHUB_REPOSITORY"
        else
          gh release create "$TAG" _NugetOutput/*.nupkg _NugetOutput/*.snupkg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
        fi
